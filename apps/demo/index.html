<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-mind-map · 测试用例脑图</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }
      #app { display: flex; flex-direction: column; }

      header {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 16px;
        background: #fff; border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }
      header .title { font-weight: 600; }
      header .spacer { flex: 1; }
      header button, header select {
        font-size: 13px; padding: 5px 10px;
        border: 1px solid #cbd5e1; border-radius: 6px; background: #fff;
        cursor: pointer;
      }
      header .stats { color: #64748b; font-size: 12px; }

      main { flex: 1; display: flex; min-height: 0; }

      #canvas-wrap {
        position: relative; flex: 1; min-width: 0;
        background:
          linear-gradient(90deg, #f1f5f9 1px, transparent 1px) 0 0 / 100% 100%,
          linear-gradient(#f1f5f9 1px, transparent 1px) 0 0 / 100% 100%,
          #fafbfc;
        background-size: 24px 24px;
        cursor: grab;
      }
      #canvas { position: absolute; inset: 0; }

      /* DOM overlay：节点编辑框 */
      #overlay {
        position: absolute; inset: 0; pointer-events: none; overflow: hidden;
      }
      #node-editor {
        position: absolute; pointer-events: auto;
        font-size: 14px; line-height: 1;
        padding: 10px 8px;
        border: 2px solid #2563eb; border-radius: 8px;
        background: #fff; outline: none;
        white-space: pre; min-width: 120px;
        display: none;
      }

      aside {
        width: 340px; flex-shrink: 0;
        background: #fff; border-left: 1px solid #e2e8f0;
        display: flex; flex-direction: column;
      }
      aside.empty { align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; }

      .panel-head {
        padding: 12px 16px; border-bottom: 1px solid #e2e8f0;
      }
      .panel-head .node-path { font-size: 12px; color: #64748b; margin-bottom: 4px; }
      .panel-head .node-title { font-size: 15px; font-weight: 600; }

      .tabs { display: flex; border-bottom: 1px solid #e2e8f0; }
      .tab {
        flex: 1; text-align: center; padding: 9px 0; font-size: 13px;
        color: #64748b; cursor: pointer; border-bottom: 2px solid transparent;
      }
      .tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 500; }
      .tab .badge-count {
        display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 2px;
        background: #dc2626; color: #fff; border-radius: 8px; font-size: 10px;
      }

      .panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; font-size: 13px; }

      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
      .field input, .field textarea, .field select {
        width: 100%; font-size: 13px; padding: 7px 9px;
        border: 1px solid #cbd5e1; border-radius: 6px; background: #fff;
        font-family: inherit;
      }
      .field textarea { resize: vertical; min-height: 54px; }
      .steps-list textarea { margin-bottom: 6px; }
      .btn-row { display: flex; gap: 8px; margin-top: 4px; }
      .btn {
        padding: 6px 12px; font-size: 13px; border-radius: 6px;
        border: 1px solid #cbd5e1; background: #fff; cursor: pointer;
      }
      .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
      .btn.danger { color: #dc2626; border-color: #fca5a5; }
      .btn:disabled { opacity: 0.5; cursor: default; }

      /* 批注线程 */
      .thread { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
      .thread .meta { font-size: 11px; color: #94a3b8; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
      .thread .who { font-weight: 600; color: #475569; }
      .thread .who.ai { color: #7c3aed; }
      .thread .status-chip { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
      .thread .status-chip.open { background: #fef3c7; color: #b45309; }
      .thread .status-chip.resolved { background: #dcfce7; color: #15803d; }
      .thread .body { font-size: 13px; line-height: 1.5; }
      .thread .reply { margin-top: 8px; padding-left: 10px; border-left: 2px solid #e2e8f0; }
      .thread .reply .body { font-size: 12px; }
      .thread .actions { margin-top: 8px; display: flex; gap: 6px; }
      .thread .actions button { font-size: 12px; padding: 3px 8px; }
      .reply-box textarea { width: 100%; min-height: 40px; margin-top: 8px; }

      .footer-hint {
        padding: 8px 16px; border-top: 1px solid #e2e8f0;
        font-size: 11px; color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="title" id="doc-title">ai-mind-map</span>
        <span class="stats" id="stats"></span>
        <span class="spacer"></span>
        <label><input type="checkbox" id="filter-annotated" style="vertical-align:-2px" /> 仅看有批注</label>
        <button id="load-file">加载 JSON</button>
        <button id="import-xmind">导入 XMind</button>
        <button id="export-xmind">导出 XMind</button>
        <button id="export-md">导出 MD</button>
        <button id="btn-expand-all">全部展开</button>
        <button id="btn-collapse-all">全部折叠</button>
        <button id="btn-add-case" class="primary">+ 用例</button>
      </header>
      <main>
        <div id="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div id="overlay"><div id="node-editor" contenteditable="true"></div></div>
        </div>
        <aside id="panel" class="empty">
          <div id="panel-empty">选中节点查看详情<br /><span style="font-size:11px">双击节点编辑文本 · 滚轮平移 · Ctrl+滚轮缩放</span></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
